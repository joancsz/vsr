# Ambiente do projeto VSR. Criar: conda env create -f environment.yml
# Versões exatas (com builds, win-64): environment.lock.txt
# Checagem em tempo de execução: vsr_comum.verificar_ambiente()
name: vsr
channels:
  - defaults
dependencies:
  - python=3.14.8
  - pandas=3.0.6
  - numpy=2.5.3
  - pyarrow=24.0.0
  - requests=2.34.2
  - matplotlib=3.11.2
  - statsmodels=0.15.0
  - scipy=1.18.1
  - lightgbm=4.7.0
  - nbformat=5.11.0
  - nbconvert=7.17.1
  - ipykernel=7.3.0
  - jupyter=1.1.1
